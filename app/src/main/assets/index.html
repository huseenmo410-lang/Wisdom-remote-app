<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Samsung Smart Remote</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: white; user-select: none; }
    .btn-action { active:scale-95; transition: transform 0.1s; }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-xs bg-slate-800 rounded-3xl p-6 shadow-2xl border border-slate-700">
    <!-- IP & Protocol Settings -->
    <div class="mb-4">
      <label class="text-xs text-slate-400 font-bold uppercase">TV Hotspot IP</label>
      <input id="tvIp" type="text" value="192.168.43.100" class="w-full mt-1 p-2 bg-slate-900 border border-slate-700 rounded text-center text-emerald-400 font-mono text-sm focus:outline-none focus:border-emerald-500">
      
      <div class="flex items-center justify-between mt-2 text-xs text-slate-400">
        <span>Use C++ Legacy Port (55000)</span>
        <input id="useLegacy" type="checkbox" class="accent-emerald-500">
      </div>
    </div>

    <!-- Power & Source -->
    <div class="flex justify-between mb-6">
      <button onclick="pressKey('KEY_POWER')" class="w-12 h-12 rounded-full bg-red-600 hover:bg-red-500 flex items-center justify-center font-bold text-xl shadow-lg active:scale-90 transition">POWER</button>
      <button onclick="pressKey('KEY_SOURCE')" class="w-12 h-12 rounded-full bg-slate-700 hover:bg-slate-600 flex items-center justify-center text-xs font-bold shadow-lg active:scale-90 transition">SOURCE</button>
    </div>

    <!-- D-Pad Navigation -->
    <div class="relative w-48 h-48 mx-auto mb-6 bg-slate-900 rounded-full border border-slate-700 flex items-center justify-center">
      <button onclick="pressKey('KEY_UP')" class="absolute top-2 left-1/2 -translate-x-1/2 w-12 h-10 bg-slate-800 rounded-t-full font-bold text-xs">▲</button>
      <button onclick="pressKey('KEY_DOWN')" class="absolute bottom-2 left-1/2 -translate-x-1/2 w-12 h-10 bg-slate-800 rounded-b-full font-bold text-xs">▼</button>
      <button onclick="pressKey('KEY_LEFT')" class="absolute left-2 top-1/2 -translate-y-1/2 w-10 h-12 bg-slate-800 rounded-l-full font-bold text-xs">◀</button>
      <button onclick="pressKey('KEY_RIGHT')" class="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-12 bg-slate-800 rounded-r-full font-bold text-xs">▶</button>
      <button onclick="pressKey('KEY_ENTER')" class="w-14 h-14 bg-emerald-600 hover:bg-emerald-500 rounded-full font-bold text-sm shadow-md active:scale-90 transition">OK</button>
    </div>

    <!-- Volume / Channel -->
    <div class="grid grid-cols-2 gap-4 mb-6 text-center">
      <div class="bg-slate-900 p-2 rounded-xl border border-slate-700 flex flex-col items-center">
        <button onclick="pressKey('KEY_VOLUP')" class="w-full py-2 bg-slate-800 rounded font-bold mb-1">+</button>
        <span class="text-xs text-slate-400 font-bold">VOL</span>
        <button onclick="pressKey('KEY_VOLDOWN')" class="w-full py-2 bg-slate-800 rounded font-bold mt-1">-</button>
      </div>
      <div class="bg-slate-900 p-2 rounded-xl border border-slate-700 flex flex-col items-center">
        <button onclick="pressKey('KEY_CHUP')" class="w-full py-2 bg-slate-800 rounded font-bold mb-1">▲</button>
        <span class="text-xs text-slate-400 font-bold">CH</span>
        <button onclick="pressKey('KEY_CHDOWN')" class="w-full py-2 bg-slate-800 rounded font-bold mt-1">▼</button>
      </div>
    </div>

    <!-- Home & Back -->
    <div class="flex justify-around">
      <button onclick="pressKey('KEY_RETURN')" class="px-4 py-2 bg-slate-700 rounded-lg text-xs font-bold">RETURN</button>
      <button onclick="pressKey('KEY_HOME')" class="px-4 py-2 bg-blue-600 rounded-lg text-xs font-bold">HOME</button>
    </div>
  </div>

  <script>
    function pressKey(key) {
      const ip = document.getElementById('tvIp').value;
      const isLegacy = document.getElementById('useLegacy').checked;

      // Call Native Java interface created in MainActivity.java
      if (window.AndroidNativeBridge) {
        window.AndroidNativeBridge.sendTvCommand(ip, key, isLegacy);
      } else {
        console.log(`[Browser Simulation] Command: ${key} -> IP: ${ip} (Legacy: ${isLegacy})`);
      }
    }
  </script>
</body>
      </html>
